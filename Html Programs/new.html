<style>
    .box {
        width: 200px;
        height: 200px;
        position: relative;
        top: 10%;

        background-color: #f43232;
        border: 2px solid #000;
        display: flex;
        margin: 10px auto;
    }
    .box2 {
        width: 200px;

        width: 50px;
        height: 50px;
        border-radius: 50%;

        position: absolute;
