<!DOCTYPE html>
<html>

<head>

    <title>Class and ID</title>

    <style>

        .student {
            color: green;
            font-size: 20px;
        }

        .student:hover {
            color: blue;
        }

        #backbencher {
            color: red;
            font-size: 25px;
            font-weight: bold;
            background-color: lightyellow;
        }

        #teacher {
            color: navy;
            text-align: center;
            font-size: 35px;
        }

    </style>

</head>


<body>

    <h1 id="teacher">
        Welcome to the Classroom 
    </h1>


    <p class="student">
        Rahul: Sir, attendance lag gayi?
    </p>

    <p class="student">
        Priya: Sir, assignment kal pakka submit karungi.
    </p>

    <p class="student">
        Aman: Sir, Wi-Fi nahi chal raha tha.
    </p>


    <p id="backbencher">
        Rohan: Sir, main toh bas attendance lene aaya tha. 😂
    </p>


    <p class="student">
        Teacher: Tum log padhne aaye ho ya excuses banane?
    </p>

</body>

</html>
