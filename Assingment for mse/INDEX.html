<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .login-box {
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background-color: white;
            text-align: center;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }
        .pass{
            width: 90%;
            padding: 10px;
            margin: 0px 0;
        }

        button {
            padding: 10px 25px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }
        .button1 {
            width: auto;
            padding: 5px 10px;
            margin-top: -20px;
            margin-bottom: 5px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            font-weight: bold;
        }
    </style>
</head>



    <div class="login-box">

        <h2>Login</h2>

        <input type="text" id="username" placeholder="Username">

        <input class="pass" type="password" id="password" placeholder="Password">
        <p id="message"></p>
        <br style=height:10px;>
        <button class="button1" onclick="showPassword()">Show Password</button>

        <br>
        <button onclick="login()">Login</button>
    </div>
<script src="script.js"></script>
</body>
</html>
